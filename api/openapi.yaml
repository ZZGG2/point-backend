# Contract First: API 변경은 이 파일을 먼저 수정한다 (AGENTS.md 레포별 규칙)
# 프론트는 이 파일로 타입을 생성한다: point-frontend `npm run gen:api`
openapi: 3.0.3
info:
  title: Point Platform API
  version: 0.1.0
servers:
  - url: https://api.CHANGE_ME_DOMAIN
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
  /api/points/balance:
    get:
      tags: [point]
      parameters:
        - $ref: "#/components/parameters/DevUserId"
      responses:
        "200":
          description: 잔액
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceResponse" }
  /api/points/history:
    get:
      tags: [point]
      parameters:
        - $ref: "#/components/parameters/DevUserId"
      responses:
        "200":
          description: 최근 거래 내역 20건
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryResponse" }
  /api/points/use:
    post:
      tags: [point]
      parameters:
        - $ref: "#/components/parameters/DevUserId"
        - in: header
          name: Idempotency-Key
          required: true
          description: "요청마다 새로 만든 UUID. 같은 키로 재요청하면 다시 차감하지 않는다 (사용자별로 구분, 최대 64자)"
          schema: { type: string, format: uuid, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsePointRequest" }
      responses:
        "200": { description: "사용 완료 (data.balance = 처리 후 잔액)", content: { application/json: { schema: { $ref: "#/components/schemas/BalanceResponse" } } } }
        "400": { description: "Idempotency-Key 누락·형식 오류 (code=INVALID_REQUEST)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: "잔액 부족 (code=INSUFFICIENT_BALANCE)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/events/{eventId}/answers:
    post:
      tags: [event]
      parameters:
        - { in: path, name: eventId, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/DevUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizAnswerRequest" }
      responses:
        "202": { description: "당첨 (code=WON, 지급 예정 — 원장 반영은 비동기)", content: { application/json: { schema: { $ref: "#/components/schemas/ResultResponse" } } } }
        "200": { description: "낙첨 (code=LOST)", content: { application/json: { schema: { $ref: "#/components/schemas/ResultResponse" } } } }
        "409": { description: "중복 참여 (code=DUPLICATE)", content: { application/json: { schema: { $ref: "#/components/schemas/ResultResponse" } } } }
        "410": { description: "이벤트 없음/마감 (code=CLOSED)", content: { application/json: { schema: { $ref: "#/components/schemas/ResultResponse" } } } }
        "503": { $ref: "#/components/responses/EventUnavailable" }
  /api/events/attendance:
    post:
      tags: [event]
      summary: 출석체크 (KST 기준 1일 1회)
      parameters:
        - $ref: "#/components/parameters/DevUserId"
      responses:
        "202": { description: "출석 완료 (code=ATTENDED, 지급 예정 — 원장 반영은 비동기)", content: { application/json: { schema: { $ref: "#/components/schemas/AttendanceResponse" } } } }
        "409": { description: "오늘 이미 출석 (code=ALREADY_ATTENDED)", content: { application/json: { schema: { $ref: "#/components/schemas/AttendanceResponse" } } } }
        "503": { $ref: "#/components/responses/EventUnavailable" }
  /api/events/{eventId}/status:
    get:
      tags: [event]
      summary: "이벤트 현황 (local 프로필 전용 — 운영에서는 404)"
      security: []
      parameters:
        - { in: path, name: eventId, required: true, schema: { type: string } }
      responses:
        "200": { description: 현황, content: { application/json: { schema: { $ref: "#/components/schemas/EventStatusResponse" } } } }
  /api/events/{eventId}/open:
    post:
      tags: [event]
      summary: "이벤트 열기/초기화 (local 프로필 전용)"
      security: []
      parameters:
        - { in: path, name: eventId, required: true, schema: { type: string } }
        - { in: query, name: stock, required: false, schema: { type: integer, format: int64, default: 3 } }
        - { in: query, name: amount, required: false, schema: { type: integer, format: int64, default: 500 } }
      responses:
        "200": { description: 초기화 후 현황, content: { application/json: { schema: { $ref: "#/components/schemas/EventStatusResponse" } } } }
  /api/system/info:
    get:
      tags: [ops]
      summary: "monolith 인스턴스·DB·Kafka 상태 (운영/인프라 검증용, OPS_API_ENABLED=false 면 비활성)"
      security: []
      responses:
        "200":
          description: "구성요소가 죽어 있어도 200 — 각 status(UP/DOWN/DISABLED) 로 구분"
          content: { application/json: { schema: { $ref: "#/components/schemas/MonolithSystemInfoResponse" } } }
  /api/system/whoami:
    get:
      tags: [ops]
      summary: "응답한 monolith 인스턴스 정보만 (부하 분산 확인용, 외부 점검 없음)"
      security: []
      responses:
        "200": { description: 인스턴스, content: { application/json: { schema: { $ref: "#/components/schemas/InstanceInfoResponse" } } } }
  /api/events/system/whoami:
    get:
      tags: [ops]
      summary: "응답한 event-service 인스턴스 정보만 (부하 분산 확인용, 외부 점검 없음)"
      security: []
      responses:
        "200": { description: 인스턴스, content: { application/json: { schema: { $ref: "#/components/schemas/InstanceInfoResponse" } } } }
        "503": { $ref: "#/components/responses/EventUnavailable" }
  /api/system/ledger:
    get:
      tags: [ops]
      summary: "원장 집계 + 전체 사용자 최근 활동 (운영/인프라 검증용)"
      security: []
      parameters:
        - { in: query, name: recent, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 15 } }
      responses:
        "200": { description: 집계, content: { application/json: { schema: { $ref: "#/components/schemas/LedgerStatsResponse" } } } }
  /api/events/system/info:
    get:
      tags: [ops]
      summary: "event-service 인스턴스·Redis·Kafka 상태 (ALB 경로 라우팅을 그대로 탐 / DR 모드에서는 503 EVENT_MAINTENANCE)"
      security: []
      responses:
        "200":
          description: "구성요소가 죽어 있어도 200 — 각 status 로 구분"
          content: { application/json: { schema: { $ref: "#/components/schemas/EventSystemInfoResponse" } } }
        "503": { $ref: "#/components/responses/EventUnavailable" }
    # TODO(#이슈): 나머지 API 명세 — point-infra docs/03-development/api-spec.md 기준
components:
  responses:
    EventUnavailable:
      description: |
        이벤트 일시 불가. code 로 구분한다.
        - EVENT_MAINTENANCE: DR 모드 점검 (Ingress 응답, ADR-0004)
        - EVENT_RETRY: 보상 발행 실패. 참여 기록은 되돌려졌으므로 잠시 후 같은 요청을 다시 보내면 된다
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  parameters:
    DevUserId:
      in: header
      name: X-User-Id
      required: true
      description: "로컬 개발용 임시 사용자 식별 (TODO: JWT 도입 시 제거)"
      schema: { type: integer, format: int64 }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginResponse:
      type: object
      properties:
        code: { type: string }
        data:
          type: object
          properties:
            accessToken: { type: string }
    BalanceResponse:
      type: object
      properties:
        code: { type: string }
        data:
          type: object
          properties:
            balance: { type: integer, format: int64 }
    UsePointRequest:
      type: object
      required: [amount, merchantRef]
      properties:
        amount: { type: integer, format: int64, minimum: 1 }
        merchantRef: { type: string }
    QuizAnswerRequest:
      type: object
      required: [answer]
      properties:
        answer: { type: string }
    LedgerEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [EARN, USE, REFUND, EXPIRE, CANCEL] }
        amount: { type: integer, format: int64 }
        balanceAfter: { type: integer, format: int64 }
        source: { type: string }
        referenceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    HistoryResponse:
      type: object
      properties:
        code: { type: string }
        data:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
    ResultResponse:
      type: object
      properties:
        code: { type: string, enum: [WON, LOST, DUPLICATE, CLOSED] }
    AttendanceResponse:
      type: object
      properties:
        code: { type: string, enum: [ATTENDED, ALREADY_ATTENDED] }
    ErrorResponse:
      type: object
      properties:
        code: { type: string, example: EVENT_MAINTENANCE }
        message: { type: string }
    EventStatusResponse:
      type: object
      properties:
        code: { type: string }
        data:
          type: object
          required: [eventId, open, remainingStock, participants, winners]
          properties:
            eventId: { type: string }
            open: { type: boolean }
            remainingStock: { type: integer, format: int64 }
            participants: { type: integer, format: int64 }
            winners: { type: integer, format: int64 }
    InstanceInfo:
      type: object
      required: [service, instance, profiles, drMode, kafkaEnabled, startedAt, uptimeSeconds, javaVersion]
      properties:
        service: { type: string, example: monolith }
        instance: { type: string, description: "응답한 인스턴스 (K8s 에서는 Pod 이름)" }
        profiles: { type: array, items: { type: string } }
        drMode: { type: boolean }
        kafkaEnabled: { type: boolean }
        startedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer, format: int64 }
        javaVersion: { type: string }
    InstanceInfoResponse:
      type: object
      properties:
        code: { type: string }
        data: { $ref: "#/components/schemas/InstanceInfo" }
    ComponentStatus:
      type: object
      required: [status, details]
      properties:
        status: { type: string, enum: [UP, DOWN, DISABLED] }
        latencyMs: { type: integer, format: int64, nullable: true }
        details:
          type: object
          additionalProperties: true
          description: |
            구성요소별 정보.
            database: version, database, serverAddress, inRecovery, heartbeatAt, heartbeatLagSeconds
            redis: ping, pingMs, version, mode, role, connectedClients, usedMemory, keys
            kafka(monolith): clusterId, brokers, topic, consumerGroup, assignedPartitions, consumerLag
            kafka(event-service): clusterId, brokers, topic, topicExists, partitions, publishedOffsetTotal
        error: { type: string, nullable: true }
    MonolithSystemInfoResponse:
      type: object
      properties:
        code: { type: string }
        data:
          type: object
          required: [instance, database, kafka]
          properties:
            instance: { $ref: "#/components/schemas/InstanceInfo" }
            database: { $ref: "#/components/schemas/ComponentStatus" }
            kafka: { $ref: "#/components/schemas/ComponentStatus" }
    EventSystemInfoResponse:
      type: object
      properties:
        code: { type: string }
        data:
          type: object
          required: [instance, redis, kafka]
          properties:
            instance: { $ref: "#/components/schemas/InstanceInfo" }
            redis: { $ref: "#/components/schemas/ComponentStatus" }
            kafka: { $ref: "#/components/schemas/ComponentStatus" }
    LedgerActivity:
      type: object
      required: [id, userId, type, amount, balanceAfter, source, createdAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        type: { type: string }
        amount: { type: integer, format: int64 }
        balanceAfter: { type: integer, format: int64 }
        source: { type: string }
        referenceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    LedgerStatsResponse:
      type: object
      properties:
        code: { type: string }
        data:
          type: object
          required: [walletCount, totalBalance, ledgerCount, bySource, recent]
          properties:
            walletCount: { type: integer, format: int64 }
            totalBalance: { type: integer, format: int64 }
            ledgerCount: { type: integer, format: int64 }
            bySource:
              type: array
              items:
                type: object
                required: [source, type, count, totalAmount]
                properties:
                  source: { type: string }
                  type: { type: string }
                  count: { type: integer, format: int64 }
                  totalAmount: { type: integer, format: int64 }
            lastEventRewardAt: { type: string, format: date-time, nullable: true }
            recent: { type: array, items: { $ref: "#/components/schemas/LedgerActivity" } }
