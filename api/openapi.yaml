# Point Platform API 명세 — API 를 바꾸면 이 파일부터 고친다
# 프론트는 이 파일로 타입을 생성한다: point-frontend `npm run gen:api`
openapi: 3.0.3
info:
  title: Point Platform API
  version: 0.1.0
servers:
  - url: https://api.CHANGE_ME_DOMAIN
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/auth/signup:
    post:
      tags: [auth]
      summary: "회원가입 (가입 즉시 로그인 — 응답은 로그인과 같다)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201": { $ref: "#/components/responses/TokenIssued" }
        "400": { description: "입력 형식 오류 (code=INVALID_REQUEST)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: "이미 가입된 이메일 (code=EMAIL_ALREADY_EXISTS, 대소문자 무시)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/auth/login:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/TokenIssued" }
        "401": { description: "이메일 또는 비밀번호 불일치 (code=INVALID_CREDENTIALS — 어느 쪽이 틀렸는지 구분하지 않는다)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/auth/refresh:
    post:
      tags: [auth]
      summary: "access token 재발급 (refresh 쿠키 사용, 쓴 refresh token 은 폐기되고 새 쿠키가 내려간다)"
      security: [{ refreshCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/TokenIssued" }
        "401": { description: "쿠키 없음·만료·이미 사용·로그아웃됨 (code=INVALID_REFRESH_TOKEN)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: "로그아웃 (refresh token 폐기 + 쿠키 삭제). 쿠키가 없어도 200"
      security: [{ refreshCookie: [] }]
      responses:
        "200": { description: 로그아웃, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/auth/jwks.json:
    get:
      tags: [auth]
      summary: "JWT 검증용 공개키 (JWKS). local 에서 event-service 가 사용"
      security: []
      responses:
        "200": { description: JWK Set, content: { application/json: { schema: { type: object, properties: { keys: { type: array, items: { type: object, additionalProperties: true } } } } } } }
  /api/users/me:
    get:
      tags: [user]
      responses:
        "200": { description: 내 정보, content: { application/json: { schema: { $ref: "#/components/schemas/UserProfileResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/points/balance:
    get:
      tags: [point]
      responses:
        "200":
          description: 잔액
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/points/history:
    get:
      tags: [point]
      responses:
        "200":
          description: 최근 거래 내역 20건
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/points/use:
    post:
      tags: [point]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: "요청마다 새로 만든 UUID. 같은 키로 재요청하면 다시 차감하지 않는다 (사용자별로 구분, 최대 64자)"
          schema: { type: string, format: uuid, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsePointRequest" }
      responses:
        "200": { description: "사용 완료 (data.balance = 처리 후 잔액)", content: { application/json: { schema: { $ref: "#/components/schemas/BalanceResponse" } } } }
        "400": { description: "Idempotency-Key 누락·형식 오류 (code=INVALID_REQUEST)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "잔액 부족 (code=INSUFFICIENT_BALANCE)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/events/{eventId}/answers:
    post:
      tags: [event]
      parameters:
        - { in: path, name: eventId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizAnswerRequest" }
      responses:
        "202": { description: "당첨 (code=WON, 지급 예정 — 원장 반영은 비동기)", content: { application/json: { schema: { $ref: "#/components/schemas/ResultResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200": { description: "낙첨 (code=LOST)", content: { application/json: { schema: { $ref: "#/components/schemas/ResultResponse" } } } }
        "409": { description: "중복 참여 (code=DUPLICATE)", content: { application/json: { schema: { $ref: "#/components/schemas/ResultResponse" } } } }
        "410": { description: "이벤트 없음/마감 (code=CLOSED)", content: { application/json: { schema: { $ref: "#/components/schemas/ResultResponse" } } } }
        "503": { $ref: "#/components/responses/EventUnavailable" }
  /api/events/attendance:
    post:
      tags: [event]
      summary: 출석체크 (KST 기준 1일 1회)
      responses:
        "202": { description: "출석 완료 (code=ATTENDED, 지급 예정 — 원장 반영은 비동기)", content: { application/json: { schema: { $ref: "#/components/schemas/AttendanceResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "오늘 이미 출석 (code=ALREADY_ATTENDED)", content: { application/json: { schema: { $ref: "#/components/schemas/AttendanceResponse" } } } }
        "503": { $ref: "#/components/responses/EventUnavailable" }
  /api/events/{eventId}/status:
    get:
      tags: [event]
      summary: "이벤트 현황 (인증 없음). 없는 id 면 open=false, 수치 0"
      security: []
      parameters:
        - { in: path, name: eventId, required: true, schema: { type: string } }
      responses:
        "200": { description: 현황, content: { application/json: { schema: { $ref: "#/components/schemas/EventStatusResponse" } } } }
  /api/events/{eventId}/open:
    post:
      tags: [event]
      summary: "이벤트 열기/초기화 (local 프로필 전용 — 운영에서는 404). 참여자·당첨자를 지우고 마감 없이 다시 연다. 운영 생성은 POST /api/events/admin/{eventId}"
      security: []
      parameters:
        - { in: path, name: eventId, required: true, schema: { type: string } }
        - { in: query, name: stock, required: false, schema: { type: integer, format: int64, default: 3 } }
        - { in: query, name: amount, required: false, schema: { type: integer, format: int64, default: 500 } }
      responses:
        "200": { description: 초기화 후 현황, content: { application/json: { schema: { $ref: "#/components/schemas/EventStatusResponse" } } } }
  /api/events/admin/{eventId}:
    post:
      tags: [event]
      summary: "운영용 이벤트 생성 (X-Admin-Token, event-day 런북 전용 — 프론트에서 호출하지 않는다)"
      description: |
        - 한 번 쓴 eventId 는 다시 쓸 수 없다 (409). 같은 id 를 다시 열면 멱등키(eventId:userId)가 겹쳐 새 당첨이 원장에서 무시되기 때문
        - endsAt 이 지나면 참여 마감 (answers → 410 CLOSED). 이벤트 키는 endsAt + 1일에 만료 (ADR-0007), 보상 Stream 은 만료되지 않는다 (ADR-0019)
      security: [{ adminToken: [] }]
      parameters:
        - { in: path, name: eventId, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateEventRequest" } } }
      responses:
        "201": { description: "생성 (code=CREATED)", content: { application/json: { schema: { $ref: "#/components/schemas/EventStatusResponse" } } } }
        "400": { description: "입력 오류 (code=INVALID_REQUEST) — stock·amount 는 1 이상, endsAt 은 미래 시각", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: "토큰 없음·불일치, 또는 서버에 ADMIN_API_TOKEN 미설정 (code=FORBIDDEN)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: "이미 사용한 eventId (code=EVENT_ALREADY_EXISTS)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/health:
    get:
      tags: [ops]
      summary: "서비스 이용 가능 여부 (인증 불필요, OPS_API_ENABLED 와 무관하게 항상 켜짐). 프론트 점검 화면 판단·회복 확인용"
      security: []
      responses:
        "200": { description: "이용 가능 (data.status=UP)", content: { application/json: { schema: { $ref: "#/components/schemas/HealthResponse" } } } }
        "503": { description: "DB 등 핵심 구성요소 불가 (code=SERVICE_UNAVAILABLE)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/system/info:
    get:
      tags: [ops]
      summary: "core-service 인스턴스·DB·원장 반영 Stream 상태 (운영/인프라 검증용, OPS_API_ENABLED=false 면 비활성)"
      security: []
      responses:
        "200":
          description: "구성요소가 죽어 있어도 200 — 각 status(UP/DOWN/DISABLED) 로 구분"
          content: { application/json: { schema: { $ref: "#/components/schemas/CoreServiceSystemInfoResponse" } } }
  /api/system/whoami:
    get:
      tags: [ops]
      summary: "응답한 core-service 인스턴스 정보만 (부하 분산 확인용, 외부 점검 없음)"
      security: []
      responses:
        "200": { description: 인스턴스, content: { application/json: { schema: { $ref: "#/components/schemas/InstanceInfoResponse" } } } }
  /api/events/system/whoami:
    get:
      tags: [ops]
      summary: "응답한 event-service 인스턴스 정보만 (부하 분산 확인용, 외부 점검 없음)"
      security: []
      responses:
        "200": { description: 인스턴스, content: { application/json: { schema: { $ref: "#/components/schemas/InstanceInfoResponse" } } } }
        "503": { $ref: "#/components/responses/EventUnavailable" }
  /api/system/ledger:
    get:
      tags: [ops]
      summary: "원장 집계 + 전체 사용자 최근 활동 (운영/인프라 검증용)"
      security: []
      parameters:
        - { in: query, name: recent, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 15 } }
      responses:
        "200": { description: 집계, content: { application/json: { schema: { $ref: "#/components/schemas/LedgerStatsResponse" } } } }
  /api/events/system/info:
    get:
      tags: [ops]
      summary: "event-service 인스턴스·Redis 상태 (ALB 경로 라우팅을 그대로 탐 / DR 모드에서는 503 EVENT_MAINTENANCE)"
      security: []
      responses:
        "200":
          description: "구성요소가 죽어 있어도 200 — 각 status 로 구분"
          content: { application/json: { schema: { $ref: "#/components/schemas/EventSystemInfoResponse" } } }
        "503": { $ref: "#/components/responses/EventUnavailable" }
    # TODO(#이슈): 나머지 API 명세 — point-infra docs/03-development/api-spec.md 기준
components:
  responses:
    Unauthorized:
      description: "access token 없음·만료·위조 (code=UNAUTHORIZED) → 프론트는 /api/auth/refresh 후 재시도, 실패하면 로그인 화면"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TokenIssued:
      description: "로그인 성공. 본문 = access token (메모리에만 보관), Set-Cookie = point_refresh (HttpOnly, SameSite=Strict, Path=/api/auth)"
      headers:
        Set-Cookie: { schema: { type: string }, description: "point_refresh=...; HttpOnly; SameSite=Strict; Path=/api/auth" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TokenResponse" }
    EventUnavailable:
      description: |
        이벤트 일시 불가. code 로 구분한다.
        - EVENT_MAINTENANCE: DR 모드 점검 (Gateway → maintenance 응답, ADR-0004·0014)
        - EVENT_RETRY: Redis 연결 실패·타임아웃. 판정과 보상 기록은 한 Lua 스크립트라 둘 중 하나만 남지 않는다. 잠시 후 같은 요청을 다시 보내면 되고, 재시도가 409 면 이미 처리된 것이다 (ADR-0019)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: "RS256, iss=point-core, sub=사용자 id" }
    refreshCookie: { type: apiKey, in: cookie, name: point_refresh }
    adminToken: { type: apiKey, in: header, name: X-Admin-Token, description: "운영 런북 전용 (ADMIN_API_TOKEN)" }
  schemas:
    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email, maxLength: 255, description: "앞뒤 공백 제거 후 소문자로 저장" }
        password: { type: string, minLength: 8, maxLength: 64, pattern: '^(?=.*[A-Za-z])(?=.*\d)[\x21-\x7E]{8,64}$', description: "영문·숫자 포함 8~64자 (공백 제외 ASCII)" }
        name: { type: string, maxLength: 30 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UserProfile:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    UserProfileResponse:
      type: object
      properties:
        code: { type: string }
        data: { $ref: "#/components/schemas/UserProfile" }
    TokenResponse:
      type: object
      properties:
        code: { type: string }
        data:
          type: object
          required: [accessToken, tokenType, expiresIn, user]
          properties:
            accessToken: { type: string }
            tokenType: { type: string, enum: [Bearer] }
            expiresIn: { type: integer, format: int64, description: "access token 남은 수명(초)" }
            user: { $ref: "#/components/schemas/UserProfile" }
    HealthResponse:
      type: object
      properties:
        code: { type: string }
        data:
          type: object
          properties:
            status: { type: string, enum: [UP] }
    BalanceResponse:
      type: object
      properties:
        code: { type: string }
        data:
          type: object
          properties:
            balance: { type: integer, format: int64 }
    UsePointRequest:
      type: object
      required: [amount, merchantRef]
      properties:
        amount: { type: integer, format: int64, minimum: 1 }
        merchantRef: { type: string }
    QuizAnswerRequest:
      type: object
      required: [answer]
      properties:
        answer: { type: string }
    LedgerEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [EARN, USE, REFUND, EXPIRE, CANCEL] }
        amount: { type: integer, format: int64 }
        balanceAfter: { type: integer, format: int64 }
        source: { type: string }
        referenceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    HistoryResponse:
      type: object
      properties:
        code: { type: string }
        data:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
    ResultResponse:
      type: object
      properties:
        code: { type: string, enum: [WON, LOST, DUPLICATE, CLOSED] }
    AttendanceResponse:
      type: object
      properties:
        code: { type: string, enum: [ATTENDED, ALREADY_ATTENDED] }
    ErrorResponse:
      type: object
      properties:
        code: { type: string, example: EVENT_MAINTENANCE }
        message: { type: string }
    EventStatusResponse:
      type: object
      properties:
        code: { type: string }
        data:
          type: object
          required: [eventId, open, remainingStock, rewardAmount, participants, winners]
          properties:
            eventId: { type: string }
            open: { type: boolean }
            remainingStock: { type: integer, format: int64 }
            rewardAmount: { type: integer, format: int64, description: 당첨 시 지급 포인트 }
            participants: { type: integer, format: int64 }
            winners: { type: integer, format: int64 }
            endsAt: { type: string, format: date-time, nullable: true, description: "참여 마감 시각 (UTC). local open 이벤트는 null (마감 없음)" }
    CreateEventRequest:
      type: object
      required: [stock, amount, endsAt]
      properties:
        stock: { type: integer, format: int64, minimum: 1, description: 당첨 수량 }
        amount: { type: integer, format: int64, minimum: 1, description: 당첨 시 지급 포인트 }
        endsAt: { type: string, format: date-time, description: "참여 마감 시각 (미래, 예: 2026-12-01T12:00:00+09:00)" }
    InstanceInfo:
      type: object
      required: [service, instance, profiles, drMode, rewardStreamEnabled, startedAt, uptimeSeconds, javaVersion]
      properties:
        service: { type: string, example: core-service }
        instance: { type: string, description: "응답한 인스턴스 (K8s 에서는 Pod 이름)" }
        profiles: { type: array, items: { type: string } }
        drMode: { type: boolean }
        rewardStreamEnabled: { type: boolean, description: "원장 반영 Redis Stream 사용 여부 (core-service: DR 모드면 false, ADR-0019)" }
        startedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer, format: int64 }
        javaVersion: { type: string }
    InstanceInfoResponse:
      type: object
      properties:
        code: { type: string }
        data: { $ref: "#/components/schemas/InstanceInfo" }
    ComponentStatus:
      type: object
      required: [status, details]
      properties:
        status: { type: string, enum: [UP, DOWN, DISABLED] }
        latencyMs: { type: integer, format: int64, nullable: true }
        details:
          type: object
          additionalProperties: true
          description: |
            구성요소별 정보.
            database: version, database, serverAddress, inRecovery, heartbeatAt, heartbeatLagSeconds
            redis(event-service): ping, pingMs, version, mode, role, connectedClients, usedMemory, keys, rewardStreams
            rewardStream(core-service): consumerGroup, streams, length, pending, dlqLength
        error: { type: string, nullable: true }
    CoreServiceSystemInfoResponse:
      type: object
      properties:
        code: { type: string }
        data:
          type: object
          required: [instance, database, rewardStream]
          properties:
            instance: { $ref: "#/components/schemas/InstanceInfo" }
            database: { $ref: "#/components/schemas/ComponentStatus" }
            rewardStream: { $ref: "#/components/schemas/ComponentStatus" }
    EventSystemInfoResponse:
      type: object
      properties:
        code: { type: string }
        data:
          type: object
          required: [instance, redis]
          properties:
            instance: { $ref: "#/components/schemas/InstanceInfo" }
            redis: { $ref: "#/components/schemas/ComponentStatus" }
    LedgerActivity:
      type: object
      required: [id, userId, type, amount, balanceAfter, source, createdAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        type: { type: string }
        amount: { type: integer, format: int64 }
        balanceAfter: { type: integer, format: int64 }
        source: { type: string }
        referenceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    LedgerStatsResponse:
      type: object
      properties:
        code: { type: string }
        data:
          type: object
          required: [walletCount, totalBalance, ledgerCount, bySource, recent]
          properties:
            walletCount: { type: integer, format: int64 }
            totalBalance: { type: integer, format: int64 }
            ledgerCount: { type: integer, format: int64 }
            bySource:
              type: array
              items:
                type: object
                required: [source, type, count, totalAmount]
                properties:
                  source: { type: string }
                  type: { type: string }
                  count: { type: integer, format: int64 }
                  totalAmount: { type: integer, format: int64 }
            lastEventRewardAt: { type: string, format: date-time, nullable: true }
