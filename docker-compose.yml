# 로컬 개발 인프라: PostgreSQL 16 / Redis 7 (원장 반영 Stream 포함, ADR-0019)
# 실행: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: point
      POSTGRES_USER: app_rw
      POSTGRES_PASSWORD: app_rw
    command: ["postgres", "-c", "wal_level=logical"]   # 로컬 논리 복제 실험용 (ADR-0020)
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_rw -d point"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
