server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: monolith
  profiles:
    default: local          # K8s 에서는 SPRING_PROFILES_ACTIVE=aws / gcp-dr
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/point}
    username: ${DB_USERNAME:app_rw}
    password: ${DB_PASSWORD:app_rw}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
app:
  kafka:
    enabled: ${KAFKA_ENABLED:true}   # gcp-dr 환경에서는 false
  dr-mode: ${DR_MODE:false}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
