plugins {
    id 'org.springframework.boot' version '4.1.3' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.pointplatform'
    version = '0.1.0'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    repositories { mavenCentral() }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-webmvc'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'io.micrometer:micrometer-registry-prometheus'
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'   // Boot 4: MockMvc·@WebMvcTest 가 별도 모듈
        testImplementation 'org.springframework.boot:spring-boot-testcontainers'
        testImplementation 'org.testcontainers:testcontainers-junit-jupiter'   // Testcontainers 2: 아티팩트 이름에 testcontainers- 접두어
        // Gradle 9 부터 JUnit Platform launcher 를 자동으로 넣어주지 않는다 → 없으면 테스트 실행기 자체가 시작되지 않음
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.named('test') { useJUnitPlatform() }
}
